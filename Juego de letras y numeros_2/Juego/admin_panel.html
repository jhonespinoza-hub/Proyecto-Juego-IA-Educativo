<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Institucional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex">

    <!-- Barra Lateral -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 p-3 border-b border-slate-700">
                <i class="fa-solid fa-user-shield text-indigo-400 text-2xl"></i>
                <h2 class="font-bold text-lg">Administrador</h2>
            </div>
            <nav class="mt-6 flex flex-col gap-2">
                <button id="btn-nav-docentes" onclick="mostrarSeccion('docentes')" class="flex items-center gap-3 p-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 transition w-full text-left">
                    <i class="fa-solid fa-chalkboard-user"></i> Gestionar Docentes
                </button>
                <button id="btn-nav-cursos" onclick="mostrarSeccion('cursos')" class="flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition w-full text-left">
                    <i class="fa-solid fa-book-open"></i> Asignación de Cursos
                </button>
            </nav>
        </div>
        <button onclick="cerrarSesion()" class="flex items-center gap-3 p-3 rounded-lg bg-red-600 hover:bg-red-700 transition w-full">
            <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <!-- SECCIÓN 1: GESTIÓN DE DOCENTES -->
        <section id="sec-docentes" class="block">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800">Gestión de Docentes</h1>
                <button onclick="abrirModalDocente()" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Agregar Nuevo Docente
                </button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-slate-50 text-slate-600">
                            <th class="p-3">ID</th>
                            <th class="p-3">Nombre</th>
                            <th class="p-3">Correo</th>
                            <th class="p-3">Rol</th>
                            <th class="p-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-docentes"></tbody>
                </table>
            </div>
        </section>

        <!-- SECCIÓN 2: GESTIÓN Y REASIGNACIÓN DE CURSOS -->
        <section id="sec-cursos" class="hidden">
            <h1 class="text-2xl font-bold text-slate-800 mb-6">Asignación y Control de Cursos</h1>
            <div class="bg-white p-6 rounded-xl shadow-md">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-slate-50 text-slate-600">
                            <th class="p-3">ID Curso</th>
                            <th class="p-3">Nombre del Curso</th>
                            <th class="p-3">Docente Asignado</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cursos"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- MODAL REGISTRO DE NUEVO DOCENTE -->
    <div id="modal-docente" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-xl font-bold text-slate-800">Registrar Nuevo Docente</h3>
                <button onclick="cerrarModalDocente()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="form-nuevo-docente" onsubmit="guardarNuevoDocente(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre Completo</label>
                    <input type="text" id="docente-nombre" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Ej. Prof. Carlos Mendoza">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="docente-correo" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="carlos@escuela.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="docente-password" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
                </div>
                
                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="cerrarModalDocente()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-semibold">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold">Guardar Docente</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let listaDocentesGlobal = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const docenteStr = localStorage.getItem('docente');
            if (!docenteStr) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const usuario = JSON.parse(docenteStr);
                if (usuario.rol !== 'admin') {
                    alert('Acceso no autorizado.');
                    window.location.href = 'login.html';
                    return;
                }
            } catch (e) {
                window.location.href = 'login.html';
                return;
            }
            
            await cargarDocentes();
            await cargarCursos();
            mostrarSeccion('docentes');
        });

        function mostrarSeccion(seccion) {
            const secDocentes = document.getElementById('sec-docentes');
            const secCursos = document.getElementById('sec-cursos');
            const btnDocentes = document.getElementById('btn-nav-docentes');
            const btnCursos = document.getElementById('btn-nav-cursos');

            if (seccion === 'docentes') {
                secDocentes.classList.remove('hidden');
                secCursos.classList.add('hidden');
                btnDocentes.className = "flex items-center gap-3 p-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 transition w-full text-left";
                btnCursos.className = "flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition w-full text-left";
            } else {
                secDocentes.classList.add('hidden');
                secCursos.classList.remove('hidden');
                btnCursos.className = "flex items-center gap-3 p-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 transition w-full text-left";
                btnDocentes.className = "flex items-center gap-3 p-3 rounded-lg hover:bg-slate-800 transition w-full text-left";
            }
        }

        async function cargarDocentes() {
            const tbody = document.getElementById('tabla-docentes');
            try {
                const res = await fetch(`${API_URL}/admin/docentes`);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                listaDocentesGlobal = await res.json();
                
                if (!Array.isArray(listaDocentesGlobal) || listaDocentesGlobal.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-500">No hay docentes registrados.</td></tr>';
                    return;
                }

                tbody.innerHTML = listaDocentesGlobal.map(d => `
                    <tr class="border-b hover:bg-slate-50 text-slate-700">
                        <td class="p-3 font-mono">${d.id_docente}</td>
                        <td class="p-3 font-semibold">${d.nombre || ''}</td>
                        <td class="p-3 text-slate-600">${d.correo || ''}</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-bold ${d.rol === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                ${(d.rol || 'docente').toUpperCase()}
                            </span>
                        </td>
                        <td class="p-3 text-center">
                            ${d.rol === 'admin' 
                                ? '<span class="text-xs text-slate-400 italic">Protegido</span>' 
                                : `<button onclick="eliminarDocente(${d.id_docente})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition">Eliminar</button>`
                            }
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error al cargar docentes:", err);
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Error al conectar con la API (${err.message})</td></tr>`;
            }
        }

        async function cargarCursos() {
            const tbody = document.getElementById('tabla-cursos');
            try {
                const res = await fetch(`${API_URL}/admin/cursos`);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                
                const cursos = await res.json();

                if (!Array.isArray(cursos) || cursos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">No hay cursos registrados en la base de datos.</td></tr>';
                    return;
                }

                tbody.innerHTML = cursos.map(c => `
                    <tr class="border-b hover:bg-slate-50 text-slate-700">
                        <td class="p-3 font-mono">${c.id_curso}</td>
                        <td class="p-3 font-semibold">${c.nombre_curso}</td>
                        <td class="p-3">
                            <select id="select-docente-${c.id_curso}" class="border rounded p-2 text-sm bg-white border-slate-300 w-full max-w-xs">
                                <option value="">-- Sin docente --</option>
                                ${listaDocentesGlobal.map(d => `
                                    <option value="${d.id_docente}" ${d.id_docente === c.id_docente ? 'selected' : ''}>
                                        ${d.nombre} (${d.correo})
                                    </option>
                                `).join('')}
                            </select>
                        </td>
                        <td class="p-3 text-center flex justify-center gap-2">
                            <button onclick="reasignarDocente(${c.id_curso})" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-sm transition flex items-center gap-1">
                                <i class="fa-solid fa-floppy-disk"></i> Guardar
                            </button>
                            <button onclick="eliminarCurso(${c.id_curso})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition flex items-center gap-1">
                                <i class="fa-solid fa-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error al cargar cursos:", err);
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Error al conectar con la API (${err.message})</td></tr>`;
            }
        }

        // FUNCIONES MODAL DOCENTES
        function abrirModalDocente() {
            document.getElementById('form-nuevo-docente').reset();
            document.getElementById('modal-docente').classList.remove('hidden');
        }

        function cerrarModalDocente() {
            document.getElementById('modal-docente').classList.add('hidden');
        }

        async function guardarNuevoDocente(event) {
            event.preventDefault();

            const nombre = document.getElementById('docente-nombre').value.trim();
            const correo = document.getElementById('docente-correo').value.trim();
            const password = document.getElementById('docente-password').value;

            try {
                const res = await fetch(`${API_URL}/docentes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, correo, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alert('Docente registrado exitosamente.');
                    cerrarModalDocente();
                    await cargarDocentes();
                    await cargarCursos(); // Actualiza la lista desplegable en la pestaña de cursos
                } else {
                    alert(data.error || 'Ocurrió un error al registrar el docente.');
                }
            } catch (err) {
                alert('Error de conexión con el servidor.');
            }
        }

        async function reasignarDocente(idCurso) {
            const select = document.getElementById(`select-docente-${idCurso}`);
            const nuevoIdDocente = select ? select.value : null;

            if (!nuevoIdDocente) {
                alert('Por favor, selecciona un docente válido.');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/admin/cursos/${idCurso}/docente`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_docente: nuevoIdDocente })
                });
                const data = await res.json();
                alert(data.message || data.error);
                cargarCursos();
            } catch (err) {
                alert('Error de conexión al reasignar el docente.');
            }
        }

        async function eliminarDocente(id) {
            if (!confirm('¿Estás seguro de eliminar este docente?')) return;
            try {
                const res = await fetch(`${API_URL}/admin/docentes/${id}`, { method: 'DELETE' });
                const data = await res.json();
                alert(data.message || data.error);
                await cargarDocentes();
                await cargarCursos();
            } catch (err) {
                alert('Error al intentar eliminar el docente.');
            }
        }

        async function eliminarCurso(idCurso) {
            if (!confirm('⚠️ ATENCIÓN: ¿Estás seguro de eliminar este curso?\n\nEsta acción eliminará el curso y todos sus alumnos y partidas asociadas de forma permanente.')) return;
            try {
                const res = await fetch(`${API_URL}/admin/cursos/${idCurso}`, { method: 'DELETE' });
                const data = await res.json();
                
                if (res.ok) {
                    alert(data.message || 'Curso eliminado correctamente.');
                } else {
                    alert(data.error || 'No se pudo eliminar el curso.');
                }
                
                await cargarCursos();
            } catch (err) {
                alert('Error al intentar conectar con el servidor para eliminar el curso.');
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('docente');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
